<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pragati Solar Hub - AI Solar Consultant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            box-sizing: border-box !important; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        html, body {
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background: #ffffff;
            position: fixed;
            left: 0;
            top: 0;
        }

        /* Main Container: Right side safe offset diya hai */
        .app-container {
            width: 100% !important;
            height: 100% !important;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden !important;
            padding-right: 35px !important; /* Forces all content inside visible screen */
        }

        /* Header */
        .app-header {
            position: relative;
            background-color: #0b254a;
            background-image: linear-gradient(180deg, rgba(2, 30, 60, 0.4) 0%, rgba(2, 20, 45, 0.75) 100%), url('header-bg.jpg');
            background-size: cover;
            background-position: center bottom;
            color: white;
            padding: 10px 10px 18px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 2px solid #22c55e;
            width: 100% !important;
        }

        .header-left { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            min-width: 0;
            flex: 1;
        }
        
        .avatar-box {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #22c55e;
            flex-shrink: 0;
            overflow: hidden;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            border: 1.5px solid white;
        }

        .header-meta {
            min-width: 0;
            flex: 1;
        }
        .header-meta h2 { 
            font-size: 0.90rem; 
            font-weight: 800; 
            line-height: 1.2; 
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-meta .status-sub { 
            font-size: 0.65rem; 
            color: #bae6fd; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            margin-top: 1px;
            font-weight: 600;
        }

        .chat-body {
            flex: 1;
            background: #f8fafc;
            overflow-y: auto;
            overflow-x: hidden !important;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100% !important;
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 90%;
            width: fit-content;
        }
        .msg-row.bot { align-self: flex-start; }
        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .bubble-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid #22c55e;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .bubble-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bubble {
            padding: 8px 12px;
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            border-radius: 14px;
            max-width: 100%;
        }
        .bot .bubble {
            background: #f0fdf4;
            color: #0f172a;
            border-top-left-radius: 4px;
            border: 1px solid #dcfce7;
        }
        .user .bubble {
            background: #0e3860;
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        .chips-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-left: 36px;
        }
        .chip-card {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
        }
        .chip-card.highlight {
            background: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }
        .chip-card.blue-outline {
            border-color: #bae6fd;
            color: #0e3860;
        }

        /* 🔒 FOOTER LOCK: Isme extra right margin lock hai */
        .footer-action-bar {
            padding: 8px 10px 12px 8px !important;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 8px !important;
            flex-shrink: 0 !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .input-pill {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            border-radius: 20px;
            padding: 0 10px;
            height: 38px;
        }

        .input-pill input {
            width: 100% !important;
            min-width: 0 !important;
            border: none;
            outline: none;
            font-size: 15px !important;
            color: #1e293b;
            background: transparent;
        }

        .btn-send-theme {
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            max-width: 36px !important;
            border-radius: 50%;
            background: #16a34a;
            color: #ffffff;
            display: flex !important;
            align-items: center;
            justify-content: center;
            border: none;
            font-size: 14px;
            cursor: pointer;
            flex: 0 0 36px !important;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <div class="app-header">
        <div class="header-left">
            <div class="avatar-box">
                <img src="logo.png" alt="Pragati" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/8618/8618881.png';">
                <div class="online-dot"></div>
            </div>
            <div class="header-meta">
                <h2>Pragati Solar Hub</h2>
                <div class="status-sub"><span style="color:#22c55e;">●</span> Online AI Consultant</div>
            </div>
        </div>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="msg-row bot">
            <div class="bubble-avatar"><img src="logo.png" alt="bot" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/8618/8618881.png';"></div>
            <div class="bubble">☀️ Namaste & Welcome to Pragati Solar Hub! 🙏

Please select your language / अपनी भाषा चुनें:
1️⃣ English
2️⃣ Hinglish (हिंदी)

(You can click below or directly type your monthly electricity bill)</div>
        </div>

        <div class="chips-list active-chips">
            <div class="chip-card highlight" onclick="sendMessage('2', '🇮🇳 Hinglish (हिंदी)')">🇮🇳 Hinglish (हिंदी)</div>
            <div class="chip-card blue-outline" onclick="sendMessage('1', '🌐 English')">🌐 English</div>
        </div>
    </div>

    <div class="footer-action-bar">
        <div class="input-pill">
            <input type="text" id="userInput" placeholder="Apna jawab likhein..." onkeypress="handleKey(event)">
        </div>
        <button class="btn-send-theme" id="sendBtn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    let conversationHistory = [];
    const BACKEND_URL = (window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost" || window.location.protocol === "file:")
        ? "http://127.0.0.1:8000/chat"
        : "https://solar-sathi-ai.onrender.com/chat";

    function getTimeString() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        const chat = document.getElementById("chatBody");
        setTimeout(() => {
            chat.scrollTop = chat.scrollHeight;
        }, 120);
    }

    const userInput = document.getElementById("userInput");
    userInput.addEventListener("focus", () => {
        scrollToBottom();
    });

    let isSending = false;

    async function sendMessage(presetText = null, displayLabel = null) {
        if (isSending) return;
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        
        const backendPayload = presetText ? presetText.trim() : input.value.trim();
        const bubbleDisplay = displayLabel ? displayLabel.trim() : backendPayload;

        if (!backendPayload) return;

        isSending = true;
        appendUserMessage(bubbleDisplay);
        if (!presetText) input.value = "";
        sendBtn.disabled = true;

        removeActiveChips();

        try {
            const res = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: backendPayload, 
                    history: conversationHistory, 
                    client: "pragati" 
                })
            });

            const data = await res.json();
            const botReply = data.reply || "Maaf kijiye, koi samasya aayi.";
            appendBotMessage(botReply);

            conversationHistory.push({ sender: "user", text: backendPayload });
            conversationHistory.push({ sender: "bot", text: botReply });

            renderContextualChips(botReply);
        } catch (e) {
            appendBotMessage("Network Error: Backend se connect nahi ho paya.");
        } finally {
            sendBtn.disabled = false;
            isSending = false;
        }
    }

    function appendUserMessage(text) {
        const chat = document.getElementById("chatBody");
        const div = document.createElement("div");
        div.className = "msg-row user";
        div.innerHTML = `<div class="bubble">${escapeHtml(text.trim())}</div>`;
        chat.appendChild(div);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        const chat = document.getElementById("chatBody");
        const div = document.createElement("div");
        div.className = "msg-row bot";
        div.innerHTML = `
            <div class="bubble-avatar"><img src="logo.png" alt="bot" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/8618/8618881.png';"></div>
            <div class="bubble">${escapeHtml(text.trim())}</div>
        `;
        chat.appendChild(div);
        scrollToBottom();
    }

    function renderContextualChips(reply) {
        const lower = reply.toLowerCase();
        let chips = [];

        if ((lower.includes("ghar ke liye") && lower.includes("dukan")) || (lower.includes("residential") && lower.includes("commercial"))) {
            chips = [
                { label: "🏠 Ghar ke liye", val: "ghar ke liye", style: "highlight" },
                { label: "🏢 Dukan / Commercial", val: "dukan ke liye", style: "blue-outline" }
            ];
        } else if (lower.includes("on-grid") && lower.includes("hybrid")) {
            chips = [
                { label: "☀️ On-Grid (Bill Cut)", val: "On-Grid", style: "highlight" },
                { label: "🔋 Hybrid (Battery Backup)", val: "Hybrid", style: "blue-outline" }
            ];
        }

        if (chips.length > 0) {
            const chat = document.getElementById("chatBody");
            const wrap = document.createElement("div");
            wrap.className = "chips-list active-chips";
            chips.forEach(c => {
                const btn = document.createElement("div");
                btn.className = `chip-card ${c.style}`;
                btn.innerText = c.label;
                btn.onclick = () => sendMessage(c.val, c.label);
                wrap.appendChild(btn);
            });
            chat.appendChild(wrap);
            scrollToBottom();
        }
    }

    function removeActiveChips() {
        document.querySelectorAll(".active-chips").forEach(el => el.remove());
    }

    function handleKey(e) {
        if (e.key === "Enter") sendMessage();
    }

    function escapeHtml(str) {
        return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
